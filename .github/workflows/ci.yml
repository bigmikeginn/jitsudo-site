name: CI

on:
  # No push trigger on master: every merge here is a PR that already ran this
  # exact workflow, so a push-triggered rerun would just retest passed code.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      - run: npm audit --audit-level=high
